name: publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tpchgen:latest
            ghcr.io/${{ github.repository_owner }}/tpchgen:${{ github.sha }}
      - name: Smoke test
        run: |
          mkdir out
          docker run --rm -v "$PWD/out:/out" \
            ghcr.io/${{ github.repository_owner }}/tpchgen:${{ github.sha }} \
            -s 0.01 --output-dir /out
          ls -l out
          test -s out/lineitem.tbl
